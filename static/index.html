<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArmchairGPT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #161922;
      --border:   #252836;
      --amber:    #f59e0b;
      --amber-dk: #92400e;
      --green:    #10b981;
      --red:      #ef4444;
      --yellow:   #f59e0b;
      --text:     #f1f5f9;
      --muted:    #64748b;
      --sub:      #94a3b8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo { font-size: 22px; }
    .header-text h1 { font-size: 18px; font-weight: 700; color: var(--amber); letter-spacing: -0.3px; }
    .header-text p  { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Welcome screen ── */
    .welcome {
      text-align: center;
      margin: auto;
      padding: 40px 20px;
    }
    .welcome h2 { font-size: 26px; color: var(--amber); margin-bottom: 8px; }
    .welcome p  { color: var(--sub); margin-bottom: 28px; font-size: 15px; }
    .examples   { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .example-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .example-btn:hover { border-color: var(--amber); color: var(--amber); }

    /* ── Message bubbles ── */
    .msg-user {
      align-self: flex-end;
      background: var(--amber-dk);
      color: #fef3c7;
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg-agent {
      align-self: flex-start;
      max-width: 90%;
      width: 100%;
    }

    /* ── Trace steps ── */
    .trace {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .trace-step {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }
    .trace-step.ok      { background: #052e16; color: #6ee7b7; border: 1px solid #065f46; }
    .trace-step.warning { background: #451a03; color: #fde68a; border: 1px solid #78350f; }
    .trace-step.error   { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .trace-step .dot    { width: 6px; height: 6px; border-radius: 50%; }
    .trace-step.ok .dot      { background: #6ee7b7; }
    .trace-step.warning .dot { background: #fde68a; }
    .trace-step.error .dot   { background: #fca5a5; }

    /* ── Answer card ── */
    .answer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .answer-text {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .answer-text strong { font-weight: 600; color: var(--amber); }

    /* ── Citations ── */
    .citations {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .citation {
      background: #0d0f14;
      border: 1px solid var(--border);
      border-left: 3px solid var(--amber);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      max-width: 280px;
    }
    .citation .ep-title { color: var(--amber); font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .citation .ep-ts    { color: var(--sub); font-size: 11px; }
    .citation .ep-quote { color: var(--sub); font-size: 11px; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .citation .ep-yt    { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px; background: #b91c1c; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-decoration: none; letter-spacing: 0.2px; }
    .citation .ep-yt:hover { background: #991b1b; }

    /* ── Special states ── */
    .msg-clarify, .msg-notfound {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--sub);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .msg-clarify .icon { font-size: 18px; flex-shrink: 0; }
    .msg-abstain {
      background: #1c1a0e;
      border: 1px solid #78350f;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      color: #fde68a;
    }

    /* ── Frequency display ── */
    .freq-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stat-box {
      background: #0d0f14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      text-align: center;
    }
    .stat-box .num  { font-size: 24px; font-weight: 700; color: var(--amber); }
    .stat-box .lbl  { font-size: 11px; color: var(--sub); margin-top: 2px; }

    /* ── Loading ── */
    .loading {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--sub);
      font-size: 13px;
      padding: 12px 0;
    }
    .dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--amber);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
      opacity: 0.7;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── Input bar ── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .input-row {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    #query-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 11px 18px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #query-input::placeholder { color: var(--muted); }
    #query-input:focus { border-color: var(--amber); }
    #send-btn {
      background: var(--amber);
      color: #000;
      border: none;
      border-radius: 24px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #send-btn:hover    { background: #d97706; }
    #send-btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    /* ── Scrollbar ── */
    #chat::-webkit-scrollbar       { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <div class="logo">🎙️</div>
  <div class="header-text">
    <h1>ArmchairGPT</h1>
    <p>Armchair Expert knowledge base</p>
  </div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>Ask about any episode</h2>
    <p>Search across hundreds of Armchair Expert transcripts with AI-powered retrieval</p>
    <div class="examples">
      <button class="example-btn" onclick="sendExample(this)">When did Dax talk about addiction with a doctor?</button>
      <button class="example-btn" onclick="sendExample(this)">What did Brené Brown say about vulnerability?</button>
      <button class="example-btn" onclick="sendExample(this)">Who has mentioned Kristen Bell?</button>
      <button class="example-btn" onclick="sendExample(this)">How many times has Dax said grateful?</button>
      <button class="example-btn" onclick="sendExample(this)">Find a clip about marriage and relationships</button>
      <button class="example-btn" onclick="sendExample(this)">Episodes about grief and loss</button>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <input id="query-input" type="text" placeholder="Ask about any Armchair Expert episode..." autocomplete="off" />
    <button id="send-btn" onclick="sendQuery()">Send →</button>
  </div>
</footer>

<script>
  const chat      = document.getElementById('chat');
  const input     = document.getElementById('query-input');
  const sendBtn   = document.getElementById('send-btn');
  const welcome   = document.getElementById('welcome');

  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendQuery(); });

  function sendExample(btn) { input.value = btn.textContent; sendQuery(); }

  function msToTs(ms) {
    const s  = Math.floor(ms / 1000);
    const h  = Math.floor(s / 3600);
    const m  = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    if (h) return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    return `${m}:${String(ss).padStart(2,'0')}`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // Render **bold** markdown in answer text
  function renderText(s) {
    return escHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function addMessage(html, cls='') {
    if (welcome) welcome.style.display = 'none';
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.innerHTML = html;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function buildTrace(trace) {
    if (!trace || !trace.length) return '';
    const steps = trace.map(t => {
      const cls = t.status === 'ok' ? 'ok' : t.status === 'warning' ? 'warning' : 'error';
      return `<div class="trace-step ${cls}"><div class="dot"></div>${escHtml(t.step)}: ${escHtml(t.detail)}</div>`;
    }).join('');
    return `<div class="trace">${steps}</div>`;
  }

  function ytLink(url, timestampMs) {
    if (!url) return null;
    if (timestampMs == null || timestampMs <= 0) return url;  // base URL, no timestamp
    const t = Math.floor(timestampMs / 1000);
    const sep = url.includes('?') ? '&' : '?';
    return `${url}${sep}t=${t}`;
  }

  function buildCitations(citations) {
    if (!citations || !citations.length) return '';
    const cards = citations.slice(0,4).map(c => {
      const yt = ytLink(c.youtube_url, c.youtube_timestamp_ms);
      const ytBtn = yt
        ? `<a class="ep-yt" href="${escHtml(yt)}" target="_blank" rel="noopener">▶ Watch on YouTube</a>`
        : '';
      return `
      <div class="citation">
        <div class="ep-title">${escHtml(c.episode_title)}</div>
        <div class="ep-ts">⏱ ${msToTs(c.start_ms)} – ${msToTs(c.end_ms)}</div>
        ${c.quote ? `<div class="ep-quote">"${escHtml(c.quote)}"</div>` : ''}
        ${ytBtn}
      </div>`;
    }).join('');
    return `<div class="citations">${cards}</div>`;
  }

  function renderResponse(data) {
    const trace = buildTrace(data.trace);

    if (data.action === 'clarify') {
      return `${trace}
        <div class="msg-agent">
          <div class="msg-clarify">
            <span class="icon">💬</span>
            <span>${escHtml(data.message || 'Could you be more specific?')}</span>
          </div>
        </div>`;
    }

    if (data.action === 'not_found') {
      return `${trace}
        <div class="msg-agent">
          <div class="msg-notfound">
            <span class="icon">🔍</span>
            <span>${escHtml(data.message || 'Nothing found for that query.')}</span>
          </div>
        </div>`;
    }

    if (data.action === 'abstain') {
      return `${trace}
        <div class="msg-agent">
          <div class="msg-abstain">⚠️ ${escHtml(data.answer)}</div>
        </div>`;
    }

    if (data.action === 'return_answer') {
      // Frequency response has special stats display
      let freqHtml = '';
      if (data.frequency) {
        const f = data.frequency;
        freqHtml = `<div class="freq-stats">
          <div class="stat-box"><div class="num">${f.total_utterances.toLocaleString()}</div><div class="lbl">utterances</div></div>
          <div class="stat-box"><div class="num">${f.total_episodes.toLocaleString()}</div><div class="lbl">episodes</div></div>
        </div>`;
      }
      const citations = buildCitations(data.citations);
      return `${trace}
        <div class="msg-agent">
          <div class="answer-card">
            ${freqHtml}
            <div class="answer-text">${renderText(data.answer)}</div>
            ${citations}
          </div>
        </div>`;
    }

    // Fallback for error
    return `${trace}
      <div class="msg-agent">
        <div class="msg-notfound">
          <span class="icon">⚠️</span>
          <span>${escHtml(data.error || JSON.stringify(data))}</span>
        </div>
      </div>`;
  }

  async function sendQuery() {
    const q = input.value.trim();
    if (!q) return;

    input.value = '';
    sendBtn.disabled = true;

    addMessage(escHtml(q), 'msg-user');

    const loader = addMessage(`
      <div class="loading">
        <div class="dots"><span></span><span></span><span></span></div>
        Running pipeline…
      </div>`);

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q }),
      });
      const data = await res.json();
      loader.remove();
      addMessage(renderResponse(data));
    } catch (err) {
      loader.remove();
      addMessage(`<div class="msg-agent"><div class="msg-notfound"><span class="icon">⚠️</span><span>Request failed: ${escHtml(String(err))}</span></div></div>`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
