<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArmchairGPT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0b0f16;
      --surface:    rgba(255, 255, 255, 0.06);
      --surface-2:  rgba(255, 255, 255, 0.085);
      --border:     rgba(255, 255, 255, 0.10);
      --border-2:   rgba(255, 255, 255, 0.16);
      --shadow:     0 12px 40px rgba(0,0,0,0.35);

      --accent:     #f7c75f;
      --accent-2:   #fbbf24;
      --accent-dk:  rgba(245, 185, 66, 0.18);

      --text:       rgba(255,255,255,0.94);
      --sub:        rgba(255,255,255,0.74);
      --muted:      rgba(255,255,255,0.58);

      --ok:         #34d399;
      --warn:       #fbbf24;
      --err:        #fb7185;
    }

    body {
      background:
        radial-gradient(900px 420px at 16% -10%, rgba(247, 199, 95, 0.22), transparent 60%),
        radial-gradient(900px 420px at 100% 0%, rgba(99, 102, 241, 0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: rgba(11, 15, 22, 0.70);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.22), rgba(245, 158, 11, 0.10));
      border: 1px solid rgba(245, 185, 66, 0.25);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      flex: 0 0 auto;
    }
    .logo svg { width: 18px; height: 18px; color: rgba(255,255,255,0.90); }
    .header-text { min-width: 0; }
    .header-text h1 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
    .header-text p  { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-spacer  { flex: 1; }
    .help-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--sub);
      border-radius: 10px;
      width: 36px; height: 36px;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .help-btn:hover { border-color: var(--border-2); color: var(--text); transform: translateY(-1px); }

    /* ── Help modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: rgba(11, 15, 22, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 18px;
      max-width: 560px; width: 90%;
      max-height: 80vh; overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .modal h3 { font-size: 14px; color: var(--text); margin-bottom: 12px; }
    .modal-close {
      float: right; background: none; border: none;
      color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .qtype-list { display: flex; flex-direction: column; gap: 12px; }
    .qtype {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 12px;
    }
    .qtype .qt-label { font-size: 11px; font-weight: 650; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.25px; text-transform: uppercase; }
    .qtype .qt-desc  { font-size: 13px; color: var(--sub); margin-bottom: 6px; line-height: 1.45; }
    .qtype .qt-ex    { font-size: 12px; color: var(--muted); }
    .qtype .qt-limit { font-size: 12px; color: rgba(245, 185, 66, 0.85); margin-top: 6px; }

    /* ── Welcome query-type guide ── */
    .qtype-guide { margin-top: 18px; text-align: left; width: 100%; max-width: 560px; }
    .qtype-guide summary { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; text-align: center; margin-bottom: 10px; }
    .qtype-guide summary:hover { color: var(--sub); }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Welcome screen ── */
    .welcome {
      text-align: center;
      margin: auto;
      padding: 34px 16px 26px;
      max-width: 760px;
    }
    .welcome h2 { font-size: 22px; color: var(--text); margin-bottom: 10px; letter-spacing: -0.3px; }
    .welcome p  { color: var(--muted); margin-bottom: 18px; font-size: 14px; line-height: 1.5; }
    .examples   { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .example-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 9px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .example-btn:hover { border-color: var(--border-2); background: rgba(255,255,255,0.07); color: var(--text); transform: translateY(-1px); }

    /* ── Message bubbles ── */
    .msg-user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.22), rgba(245, 158, 11, 0.12));
      border: 1px solid rgba(245, 185, 66, 0.22);
      color: rgba(255,255,255,0.92);
      padding: 10px 14px;
      border-radius: 14px 14px 6px 14px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg-agent {
      align-self: flex-start;
      max-width: 92%;
      width: 100%;
    }

    /* ── Trace steps ── */
    details.trace-details { margin-bottom: 10px; }
    details.trace-details summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
    }
    details.trace-details summary::-webkit-details-marker { display: none; }
    details.trace-details summary:hover { color: var(--sub); border-color: var(--border-2); }
    details.trace-details[open] summary { color: var(--sub); }
    .trace {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .trace-step {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
    }
    .trace-step.ok      { color: rgba(52, 211, 153, 0.95); }
    .trace-step.warning { color: rgba(251, 191, 36, 0.95); }
    .trace-step.error   { color: rgba(251, 113, 133, 0.95); }
    .trace-step .dot    { width: 6px; height: 6px; border-radius: 50%; }
    .trace-step.ok .dot      { background: var(--ok); }
    .trace-step.warning .dot { background: var(--warn); }
    .trace-step.error .dot   { background: var(--err); }

    /* ── Answer card ── */
    .answer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.22);
    }
    .answer-text {
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .answer-text strong { font-weight: 650; color: rgba(245, 185, 66, 0.95); }

    /* ── Citations ── */
    details.citations-details { margin-top: 12px; }
    details.citations-details summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
    }
    details.citations-details summary::-webkit-details-marker { display: none; }
    details.citations-details summary:hover { color: var(--sub); border-color: var(--border-2); }
    .citations {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
    .citation {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px;
      font-size: 12px;
    }
    .citation .ep-title { color: rgba(245, 185, 66, 0.95); font-weight: 650; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .citation .ep-ts    { color: var(--muted); font-size: 11px; }
    .citation .ep-quote { color: var(--sub); font-size: 12px; margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .citation .ep-yt    { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); font-size: 11px; font-weight: 650; padding: 6px 10px; border-radius: 10px; text-decoration: none; letter-spacing: 0.15px; }
    .citation .ep-yt:hover { border-color: var(--border-2); background: rgba(255,255,255,0.08); }

    /* ── Special states ── */
    .msg-clarify, .msg-notfound {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 12px;
      font-size: 14px;
      color: var(--sub);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .msg-clarify .icon { font-size: 18px; flex-shrink: 0; }
    .msg-abstain {
      background: rgba(245, 185, 66, 0.12);
      border: 1px solid rgba(245, 185, 66, 0.22);
      border-radius: 16px;
      padding: 12px 12px;
      font-size: 14px;
      color: rgba(255,255,255,0.88);
    }

    /* ── Frequency display ── */
    .freq-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stat-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      text-align: center;
    }
    .stat-box .num  { font-size: 22px; font-weight: 750; color: rgba(245, 185, 66, 0.95); }
    .stat-box .lbl  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ── Loading ── */
    .loading {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--sub);
      font-size: 13px;
      padding: 12px 0;
    }
    .dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
      opacity: 0.7;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── Input bar ── */
    footer {
      background: rgba(11, 15, 22, 0.70);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .input-row {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    #query-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #query-input::placeholder { color: var(--muted); }
    #query-input:focus { border-color: var(--border-2); }
    #send-btn {
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.95), rgba(245, 158, 11, 0.95));
      color: rgba(0,0,0,0.92);
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #send-btn:hover    { filter: brightness(0.98); transform: translateY(-1px); }
    #send-btn:disabled { background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.45); cursor: not-allowed; transform: none; }

    /* ── Small actions ── */
    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--sub);
      border-radius: 10px;
      height: 36px;
      padding: 0 10px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .icon-btn:hover { border-color: var(--border-2); color: var(--text); transform: translateY(-1px); }
    .icon-btn:active { transform: translateY(0px); }
    .icon-btn svg { width: 16px; height: 16px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
    }

    /* ── Answer header ── */
    .answer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .answer-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .answer-title .label {
      font-size: 12px;
      font-weight: 750;
      color: var(--text);
      letter-spacing: 0.2px;
    }
    .answer-actions {
      display: inline-flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    /* ── Lightweight toast ── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      background: rgba(11, 15, 22, 0.92);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 10px 12px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

    /* ── Scrollbar ── */
    #chat::-webkit-scrollbar       { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 520px) {
      header { padding: 12px 12px; }
      .header-text p { display: none; }
      .welcome { padding: 28px 10px 18px; }
      .msg-user { max-width: 86%; }
      .msg-agent { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8"/>
        <path d="M9.5 20.5v-3.2c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2v3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M6.2 10.6V9a5.8 5.8 0 0 1 11.6 0v1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>ArmchairGPT</h1>
      <p>Ask questions. Get cited transcript evidence.</p>
    </div>
  </div>
  <div class="header-spacer"></div>
  <button class="icon-btn" onclick="clearChat()" title="Clear chat">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 6h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M9 6V4h6v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8 10v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12 10v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M16 10v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M6 6l1 16h10l1-16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Clear
  </button>
  <button class="help-btn" onclick="toggleHelp()" title="What can I ask?">?</button>
</header>

<!-- Help modal -->
<div class="modal-overlay" id="help-modal" onclick="closeHelpOnBg(event)">
  <div class="modal">
    <button class="modal-close" onclick="toggleHelp()">×</button>
    <h3>What can I ask?</h3>
    <div class="qtype-list" id="qtype-content"></div>
  </div>
</div>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>Ask the transcript archive</h2>
    <p>Get grounded answers with episode + timestamp citations. Try one of these.</p>
    <div class="examples">
      <button class="example-btn" onclick="sendExample(this)">When did Dax talk about addiction with a doctor?</button>
      <button class="example-btn" onclick="sendExample(this)">Who has mentioned Kristen Bell?</button>
      <button class="example-btn" onclick="sendExample(this)">Episodes about grief and loss</button>
      <button class="example-btn" onclick="sendExample(this)">Find a clip about marriage and relationships</button>
      <button class="example-btn" onclick="sendExample(this)">How many times has Dax said grateful?</button>
      <button class="example-btn" onclick="sendExample(this)">What did Brené Brown say about vulnerability?</button>
    </div>
    <details class="qtype-guide">
      <summary>What kinds of questions can I ask? ▾</summary>
      <div class="qtype-list" id="qtype-welcome"></div>
    </details>
  </div>
</div>

<footer>
  <div class="input-row">
    <input id="query-input" type="text" placeholder="Ask about any Armchair Expert episode..." autocomplete="off" />
    <button id="send-btn" onclick="sendQuery()">Send</button>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const chat      = document.getElementById('chat');
  const input     = document.getElementById('query-input');
  const sendBtn   = document.getElementById('send-btn');
  const welcome   = document.getElementById('welcome');
  const toastEl   = document.getElementById('toast');

  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendQuery(); });

  function sendExample(btn) { input.value = btn.textContent; sendQuery(); }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    window.clearTimeout(toastEl._t);
    toastEl._t = window.setTimeout(() => toastEl.classList.remove('show'), 1200);
  }

  function clearChat() {
    // Remove everything except the welcome panel.
    [...chat.children].forEach(el => { if (el !== welcome) el.remove(); });
    if (welcome) welcome.style.display = '';
    input.focus();
    toast('Chat cleared');
  }

  // ── Query type guide ──────────────────────────────────────────────────────
  const QUERY_TYPES = [
    {
      label: "Factual Q&A",
      desc: "Ask what was said about a specific topic, person, or event in a particular episode.",
      ex: '"What did Matthew McConaughey say about his dad?" · "When did Dax talk about sobriety?"',
    },
    {
      label: "Topic / Episode Search",
      desc: "Find episodes or discussions on a broad theme — returns the most relevant episodes.",
      ex: '"Episodes about grief and loss" · "When did they talk about parenting?"',
    },
    {
      label: "Clip Discovery",
      desc: "Find the best clip-worthy moments — returns timestamped spans with a reason each is notable.",
      ex: '"Find a funny clip about marriage" · "Best moments about childhood memories"',
    },
    {
      label: "Mentions Lookup",
      desc: "Find out who has mentioned a specific person, or whether two people have talked about each other.",
      ex: '"Who has mentioned Kristen Bell?" · "Has Dax ever mentioned LeBron James?"',
    },
    {
      label: "Word / Phrase Frequency",
      desc: "Count how many times a word or phrase has been said across all episodes, with top episodes.",
      ex: '"How many times has Dax said grateful?" · "How often does Monica say honestly?"',
    },
    {
      label: "Not supported",
      desc: "Questions that require summarising the entire archive — e.g. \"What are Dax's most common topics?\" or \"Give me a full summary of the podcast.\" The system works from specific retrieved excerpts, not a global index.",
      ex: null,
      limit: true,
    },
  ];

  function buildQtypeHTML() {
    return QUERY_TYPES.map(qt => `
      <div class="qtype">
        <div class="qt-label">${qt.label}</div>
        <div class="qt-desc">${qt.desc}</div>
        ${qt.ex ? `<div class="qt-ex">e.g. ${qt.ex}</div>` : ''}
        ${qt.limit ? '<div class="qt-limit">⚠ Not supported by this system</div>' : ''}
      </div>`).join('');
  }

  document.getElementById('qtype-content').innerHTML = buildQtypeHTML();
  document.getElementById('qtype-welcome').innerHTML  = buildQtypeHTML();

  function toggleHelp() {
    document.getElementById('help-modal').classList.toggle('open');
  }
  function closeHelpOnBg(e) {
    if (e.target === document.getElementById('help-modal')) toggleHelp();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('help-modal').classList.remove('open'); });

  function msToTs(ms) {
    const s  = Math.floor(ms / 1000);
    const h  = Math.floor(s / 3600);
    const m  = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    if (h) return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    return `${m}:${String(ss).padStart(2,'0')}`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // Render **bold** markdown in answer text
  function renderText(s) {
    const safe = escHtml(s);
    const withBold = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // If the model returns bullet lines, render as a list (lower cognitive load).
    const lines = withBold.split(/\n/);
    const bulletIdx = lines.findIndex(l => /^\s*[-•]\s+/.test(l));
    if (bulletIdx !== -1) {
      const out = [];
      let i = 0;
      while (i < lines.length) {
        if (/^\s*[-•]\s+/.test(lines[i])) {
          const items = [];
          while (i < lines.length && /^\s*[-•]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-•]\s+/, ''));
            i++;
          }
          out.push('<ul style="margin: 8px 0 8px 18px; color: inherit;">' + items.map(it => `<li style="margin: 4px 0;">${it}</li>`).join('') + '</ul>');
          continue;
        }
        out.push(lines[i]);
        i++;
      }
      return out.join('<br/>');
    }
    return withBold.replace(/\n/g, '<br/>');
  }

  function addMessage(html, cls='') {
    if (welcome) welcome.style.display = 'none';
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.innerHTML = html;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function buildTrace(trace) {
    if (!trace || !trace.length) return '';
    const steps = trace.map(t => {
      const cls = t.status === 'ok' ? 'ok' : t.status === 'warning' ? 'warning' : 'error';
      return `<div class="trace-step ${cls}"><div class="dot"></div>${escHtml(t.step)}: ${escHtml(t.detail)}</div>`;
    }).join('');
    return `
      <details class="trace-details">
        <summary>Details</summary>
        <div class="trace">${steps}</div>
      </details>
    `;
  }

  function ytLink(url, timestampMs) {
    if (!url) return null;
    if (timestampMs == null || timestampMs <= 0) return url;  // base URL, no timestamp
    const t = Math.floor(timestampMs / 1000);
    const sep = url.includes('?') ? '&' : '?';
    return `${url}${sep}t=${t}`;
  }

  function buildCitations(citations) {
    if (!citations || !citations.length) return '';
    const n = Math.min(citations.length, 4);
    const cards = citations.slice(0,4).map(c => {
      const yt = ytLink(c.youtube_url, c.youtube_timestamp_ms);
      const ytBtn = yt
        ? `<a class="ep-yt" href="${escHtml(yt)}" target="_blank" rel="noopener">▶ Watch on YouTube</a>`
        : '';
      return `
      <div class="citation">
        <div class="ep-title">${escHtml(c.episode_title)}</div>
        <div class="ep-ts">⏱ ${msToTs(c.start_ms)} – ${msToTs(c.end_ms)}</div>
        ${c.quote ? `<div class="ep-quote">"${escHtml(c.quote)}"</div>` : ''}
        ${ytBtn}
      </div>`;
    }).join('');
    return `
      <details class="citations-details">
        <summary>Citations (${n})</summary>
        <div class="citations">${cards}</div>
      </details>
    `;
  }

  function renderResponse(data) {
    const trace = buildTrace(data.trace);

    if (data.action === 'clarify') {
      return `${trace}
        <div class="msg-agent">
          <div class="msg-clarify">
            <span class="icon" aria-hidden="true">💬</span>
            <span>${escHtml(data.message || 'Could you be more specific?')}</span>
          </div>
        </div>`;
    }

    if (data.action === 'not_found') {
      return `${trace}
        <div class="msg-agent">
          <div class="msg-notfound">
            <span class="icon" aria-hidden="true">🔍</span>
            <span>${escHtml(data.message || 'Nothing found for that query.')}</span>
          </div>
        </div>`;
    }

    if (data.action === 'abstain') {
      return `${trace}
        <div class="msg-agent">
          <div class="msg-abstain"><span aria-hidden="true">⚠️</span> ${escHtml(data.answer)}</div>
        </div>`;
    }

    if (data.action === 'return_answer') {
      // Frequency response has special stats display
      let freqHtml = '';
      if (data.frequency) {
        const f = data.frequency;
        freqHtml = `<div class="freq-stats">
          <div class="stat-box"><div class="num">${f.total_utterances.toLocaleString()}</div><div class="lbl">utterances</div></div>
          <div class="stat-box"><div class="num">${f.total_episodes.toLocaleString()}</div><div class="lbl">episodes</div></div>
        </div>`;
      }
      const citations = buildCitations(data.citations);
      return `${trace}
        <div class="msg-agent">
          <div class="answer-card">
            <div class="answer-head">
              <div class="answer-title">
                <span class="label">Answer</span>
              </div>
              <div class="answer-actions">
                <button class="icon-btn" onclick="copyAnswer(this)" title="Copy answer">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M9 9h10v12H9V9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  </svg>
                  Copy
                </button>
              </div>
            </div>
            ${freqHtml}
            <div class="answer-text">${renderText(data.answer)}</div>
            ${citations}
          </div>
        </div>`;
    }

    // Fallback for error
    return `${trace}
      <div class="msg-agent">
        <div class="msg-notfound">
          <span class="icon">⚠️</span>
          <span>${escHtml(data.error || JSON.stringify(data))}</span>
        </div>
      </div>`;
  }

  async function sendQuery() {
    const q = input.value.trim();
    if (!q) return;

    input.value = '';
    sendBtn.disabled = true;

    addMessage(escHtml(q), 'msg-user');

    const loader = addMessage(`
      <div class="loading">
        <div class="dots"><span></span><span></span><span></span></div>
        Running pipeline…
      </div>`);

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q }),
      });
      const data = await res.json();
      loader.remove();
      addMessage(renderResponse(data));
    } catch (err) {
      loader.remove();
      addMessage(`<div class="msg-agent"><div class="msg-notfound"><span class="icon">⚠️</span><span>Request failed: ${escHtml(String(err))}</span></div></div>`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function copyAnswer(btn) {
    const card = btn.closest('.answer-card');
    const txt = card ? (card.querySelector('.answer-text')?.innerText || '') : '';
    try {
      await navigator.clipboard.writeText(txt.trim());
      toast('Copied');
    } catch {
      toast('Copy failed');
    }
  }
</script>
</body>
</html>
